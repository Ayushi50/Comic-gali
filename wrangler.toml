# Cloudflare Pages project config. Create the resources, then paste the ids (see docs/BACKEND.md).
name = "comic-gali"
pages_build_output_dir = "dist"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "comic-gali"
database_id = "ada7dfc7-c3c4-42b1-9a08-5317792bf838"     # wrangler d1 create comic-gali
migrations_dir = "migrations"

# R2 is not used: enabling it requires a payment card. Uploads are stored in D1 (table `blobs`).
# To use R2 later, add [[r2_buckets]] binding = "BUCKET"; the code prefers it when present.

# Non-secret vars go here; secrets via `wrangler pages secret put NAME`.
[vars]
SITE_ORIGIN = "https://comic-gali.pages.dev"
